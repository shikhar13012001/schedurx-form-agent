# Drop this file at /etc/nginx/sites-available/scheduler.yourdomain.com
# then: ln -s /etc/nginx/sites-available/scheduler.yourdomain.com \
#             /etc/nginx/sites-enabled/scheduler.yourdomain.com
# then: certbot --nginx -d scheduler.yourdomain.com
# then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name scheduler.yourdomain.com;   # <-- replace with your actual subdomain

    # Certbot will append the HTTPS redirect and SSL block below after running
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name scheduler.yourdomain.com;   # <-- same as above

    # SSL managed by Certbot (added automatically — leave these as placeholders)
    # ssl_certificate /etc/letsencrypt/live/scheduler.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/scheduler.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all traffic to the Nettu scheduler running on localhost
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nettu API calls can take a few seconds on cold boot
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
