version: '3.8'

services:
  nettu-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nettu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 on host to avoid clash with any local postgres
    volumes:
      - nettu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nettu:
    image: fmeringdal/nettu-scheduler:0.6.0
    environment:
      ACCOUNT_API_KEY: local-nettu-key
      DATABASE_URL: postgresql://postgres:postgres@nettu-db:5432/nettu
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      nettu-db:
        condition: service_healthy
    restart: on-failure

volumes:
  nettu_pgdata:
